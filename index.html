          "name": "Posso fazer o divórcio sem ir ao tribunal em Resende/RJ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Sim. O divórcio consensual pode ser feito diretamente no cartório por escritura pública, sem abrir processo judicial. É mais rápido, mais barato e igualmente válido perante a lei. O requisito principal é que não haja filhos menores ou incapazes e que o casal esteja de acordo. O escritório Abbott Galvão conduz todo o processo extrajudicial, do acordo à escritura lavrada."
          }
        },
        {
          "@type": "Question",
          "name": "O que é Direito Extrajudicial e quais problemas ele resolve?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Direito Extrajudicial é o conjunto de soluções jurídicas resolvidas em cartório, sem abertura de processo no Judiciário. Abrange divórcio consensual, inventário, regularização de imóveis, usucapião extrajudicial e partilha de bens, entre outros. O que levaria anos na Justiça pode ser resolvido em semanas no cartório, com a mesma segurança jurídica."
          }
        },
        {
          "@type": "Question",
          "name": "Quanto tempo demora um inventário extrajudicial?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Um inventário extrajudicial pode ser concluído em semanas, dependendo da documentação disponível. O inventário judicial, por comparação, costuma levar de 2 a 5 anos. Para o inventário em cartório é necessário que todos os herdeiros sejam maiores e capazes, estejam de acordo com a partilha e não haja testamento (salvo já homologado). O escritório orienta e organiza toda a documentação necessária."
          }
        },
        {
          "@type": "Question",
          "name": "Como regularizar um imóvel sem escritura ou com documentação irregular?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "A regularização depende da situação específica do imóvel. Pode ser feita por usucapião extrajudicial, retificação de registro, inventário ou escritura de compra e venda, entre outros instrumentos. O escritório Abbott Galvão realiza análise documental completa e indica o caminho mais rápido e seguro para regularizar a situação do seu imóvel."
          }
        },
        {
          "@type": "Question",
          "name": "É obrigatório contratar advogado para procedimentos em cartório?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Sim. A legislação exige a participação de advogado em procedimentos extrajudiciais como divórcio, inventário e usucapião em cartório. O advogado garante que os direitos de todos os envolvidos sejam respeitados, elabora a minuta da escritura e acompanha o processo até o registro final."
          }
        },

          "name": "O escritório atende fora de Resende/RJ?",
